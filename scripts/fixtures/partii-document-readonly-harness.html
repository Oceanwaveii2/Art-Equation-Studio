<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Rich document read-only fixture</title><style>html,body,#root{height:100%;margin:0}#root{display:block}#root>.document-pane{height:100%}</style></head><body><div class="studio-shell workspace-dark" id="root"></div><script type="module">
import React, {useState} from 'react';
import {createRoot} from 'react-dom/client';
import {RichDocument} from '/src/document/RichDocument.tsx';
import '/src/App.css';
window.fixtureWrites={content:[],layout:[],exports:[],requests:[],prints:0};
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
 if(command==='list_system_fonts')return ['Arial','Georgia'];
 if(command==='plugin:dialog|save')return '/disposable-memory-export/'+args.options.defaultPath;
 if(command==='export_html'||command==='export_binary'){window.fixtureWrites.exports.push({command,args});return;}
 throw new Error('Unexpected native command in isolated fixture: '+command);
}};
window.print=()=>{window.fixtureWrites.prints++;};
const initial={type:'doc',content:[{type:'heading',attrs:{level:1},content:[{type:'text',text:'Read-only production brief'}]},{type:'paragraph',content:[{type:'text',text:'Select and copy this text without changing it.'}]},{type:'image',attrs:{src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jS1EAAAAASUVORK5CYII=',caption:'Original caption',alt:'Original caption',placement:'block'}},{type:'paragraph',content:[{type:'text',text:'End of fixture.'}]}]};
const initialLayout={pageSize:'letter',orientation:'portrait',margins:'standard',columns:1,theme:'paper',headerText:'Original header',footerText:'Original footer',showPageNumber:true};
function Harness(){
 const [content,setContent]=useState(initial),[layout,setLayout]=useState(initialLayout),[readOnly,setReadOnly]=useState(true);
 window.fixtureControl={setReadOnly,replaceContent:setContent,snapshot:()=>({content,layout,readOnly}),resolveRequest:value=>{const resolve=window.fixturePending;window.fixturePending=undefined;resolve?.(value);}};
 return React.createElement(RichDocument,{content,layout,readOnly,onChange:next=>{window.fixtureWrites.content.push(structuredClone(next));setContent(next);},onLayoutChange:next=>{window.fixtureWrites.layout.push(structuredClone(next));setLayout(next);},onRequestText:options=>{window.fixtureWrites.requests.push(options);return new Promise(resolve=>{window.fixturePending=resolve;});}});
}
createRoot(document.getElementById('root')).render(React.createElement(Harness));
</script></body></html>
