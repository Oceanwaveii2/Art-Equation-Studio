[package]
name = "art-equation-studio"
version = "2.5.0-alpha.1"
description = "Portable local-first visual project studio"
authors = ["Art Equation Studio"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"
default-run = "art-equation-mitigation"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "art_equation_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep the shell trial separate from the running production executable.
[[bin]]
name = "art-equation-prototype-25"
path = "src/main.rs"

# Dedicated special executable for pre-mitigation / dual-engine preparation
[[bin]]
name = "art-equation-mitigation"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
art-equation-workspace-core = { path = "../engine/workspace-core" }
serde_json = "1.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
base64 = "=0.22.1"
tauri-plugin-dialog = "2"
sysinfo = "0.38"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
tauri-plugin-opener = "2"
percent-encoding = "2"
hnsw_rs = "=0.3.4"
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "vulkan", "dx12", "wgsl"] }
pollster = "=0.4.0"
libloading = "=0.8.9"
fontique = { version = "=0.11.1", default-features = false, features = ["system"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }


[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
